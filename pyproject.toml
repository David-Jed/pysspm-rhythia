[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysspm-rhythia"
dynamic = ["version"]
authors = [
  { name="David Jedlovsky", email="Dev.DavidJed@gmail.com" },
]
description = "A Python library dedicated to reading, writing, and modifying the Rhythia SSPM (.sspm) file format"
readme = { file = "README.md", content-type = "text/markdown" }
# The parsers use structural pattern matching (`match`), which is 3.10+.
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["Rhythia", "Sound space", "SSPM", "Rhythm game", "pysspm-rhythia", "pysspm", "nova", "phoenyx", "SS+M", "sspm"]

# numpy is imported at module scope in pysspm.py, parser.py and extras.py --
# without it declared here, every install is broken on a clean environment.
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/David-Jed/pysspm"
Issues = "https://github.com/David-Jed/pysspm/issues"

[tool.setuptools.dynamic]
version = { attr = "pysspm_rhythia.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["pysspm_rhythia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
