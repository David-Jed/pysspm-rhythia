name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:      # lets the release workflow reuse this exact gate

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor: the parsers use structural pattern matching.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
          - python-version: "3.12"
            os: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          # Must consume the matrix value -- hardcoding '3.x' here silently
          # collapses the matrix into six identical runs.
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          # fail on syntax errors and undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # everything else is advisory
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run tests
        run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Verify the built wheel imports and parses standalone
        # Guards the packaging bug where parser.py imported a module name that
        # only existed inside the test harness: the package installed fine but
        # read_sspm() raised ModuleNotFoundError.
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/python -m pip install --quiet dist/*.whl
          cd /tmp
          /tmp/verify/bin/python -c "
          import io
          from pysspm_rhythia import SSPM, read_sspm
          data = SSPM(difficulty='easy', map_name='CI', mappers=['ci'], notes=[(1, 1, 500)]).write(None)
          chart = read_sspm(io.BytesIO(data))
          assert chart.map_name == 'CI', chart.map_name
          assert len(chart.notes) == 1
          print('installed wheel OK')
          "

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
