name: Publish to PyPI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # manual re-run if a publish half-failed

jobs:
  # Reuse the full CI gate. Nothing publishes unless every matrix job is green.
  ci:
    uses: ./.github/workflows/ci.yml

  check-version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should-publish: ${{ steps.check.outputs.should-publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is this version already on PyPI?
        id: check
        run: |
          VERSION=$(python -c "
          import re, pathlib
          source = pathlib.Path('pysspm_rhythia/__version__.py').read_text()
          print(re.search(r'__version__\s*=\s*[\"\x27]([^\"\x27]+)', source).group(1))
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version in tree: $VERSION"

          # PyPI rejects re-uploading an existing version, so publishing on
          # every push to main would turn the pipeline permanently red.
          # Publish only when the version has actually been bumped.
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pypi.org/pypi/pysspm-rhythia/$VERSION/json")

          if [ "$STATUS" = "200" ]; then
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is already on PyPI - skipping publish. Bump pysspm_rhythia/__version__.py to release."
          else
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$VERSION is new - publishing."
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pysspm-rhythia
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
      contents: write   # required to push the release tag

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        # Trusted Publishing -- no API token stored in the repo.
        # Configure at https://pypi.org/manage/project/pysspm-rhythia/settings/publishing/
        #   Owner: David-Jed | Repo: pysspm
        #   Workflow: publish.yml | Environment: pypi
        # To use an API token instead, delete this step and add:
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag the release
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: gh release create "v$VERSION" dist/* --generate-notes --title "v$VERSION"
